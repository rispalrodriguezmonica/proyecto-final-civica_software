version: 2

models:
  - name: dim_fecha
    description: "Calendario. Grano: una fila = un día (2024-01-01 a 2026-12-31)."
    columns:
      - name: fecha
        tests:
          - unique
          - not_null

  - name: dim_evento
    description: "Eventos (lanzamientos, deportes...). Grano: una fila = un evento."
    columns:
      - name: evento_id
        tests:
          - unique
          - not_null
      - name: fecha_evento
        tests:
          - not_null
      - name: fecha_comparacion
        tests:
          - not_null

  - name: dim_empleado
    description: "Empleados con su situación actual. Grano: una fila = un empleado."
    columns:
      - name: empleado_id
        tests:
          - unique
          - not_null
      - name: pais
        tests:
          - not_null
      - name: departamento
        tests:
          - not_null
      - name: generacion
        tests:
          - accepted_values:
              arguments:
                values: ['Baby boomers', 'Gen X', 'Millennials', 'Gen Z', 'Desconocida']

  - name: dim_tipo_ausencia
    description: "Tipos de ausencia. Grano: una fila = un tipo."
    columns:
      - name: tipo_ausencia_codigo
        tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['VAC', 'AP', 'ENF']

  - name: fct_ausencia_dia
    description: "Días de ausencia. Grano: una fila = un día laborable de una solicitud."
    tests:
      - unique:
          column_name: "solicitud_id || '-' || fecha"
    columns:
      - name: solicitud_id
        tests:
          - not_null
      - name: fecha
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha
      - name: empleado_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_empleado')
                field: empleado_id
      - name: cuenta_dias_pedidos
        tests:
          - not_null
      - name: cuenta_ausencia_real
        tests:
          - not_null

  - name: agg_indice_evento
    description: >
      Índices de ausencia por evento. Grano: una fila = un evento x un corte
      (Total, País, Generación, Departamento) x un valor. Lo lee Power BI:
      tiene contrato para que un cambio de columnas falle antes de romper el
      informe.
    config:
      contract:
        enforced: true
    tests:
      - unique:
          column_name: "evento_id || '-' || corte || '-' || valor"
    columns:
      - name: evento_id
        data_type: number(38,0)
        constraints:
          - type: not_null
      - name: evento
        data_type: varchar
      - name: tipo_evento
        data_type: varchar
      - name: fecha_evento
        data_type: date
      - name: corte
        data_type: varchar
        constraints:
          - type: not_null
      - name: valor
        data_type: varchar
      - name: plantilla_evento
        data_type: number(13,0)
      - name: plantilla_comparacion
        data_type: number(13,0)
      - name: pedidos_evento
        data_type: number(13,0)
      - name: pedidos_comparacion
        data_type: number(13,0)
      - name: reales_evento
        data_type: number(13,0)
      - name: reales_comparacion
        data_type: number(13,0)
      - name: indice_dias_pedidos
        data_type: number(20,2)
      - name: indice_ausencia_real
        data_type: number(20,2)